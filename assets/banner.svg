<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .pulse-line { fill: none; stroke: url(#pulseGrad); stroke-width: 3; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: dash 4s linear infinite; }
      .ecg-wave { fill: none; stroke: #38bdf8; stroke-width: 2.5; opacity: 0.85; filter: drop-shadow(0 0 6px rgba(56,189,248,0.6)); }
      .flow-node { fill: #1e293b; stroke: #818cf8; stroke-width: 1.5; rx: 8; }
      .node-text { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 40px; fill: url(#titleGrad); filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
      .banner-subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 16px; fill: #e2e8f0; letter-spacing: 0.5px; }
      .pill-badge { fill: rgba(56, 189, 248, 0.12); stroke: rgba(56, 189, 248, 0.3); rx: 15; }
      .pill-text { fill: #38bdf8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      
      @keyframes dash {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .floating { animation: floatSlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Overlay -->
  <g class="bg-grid">
    <line x1="0" y1="40" x2="1200" y2="40" /><line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" /><line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="150" y1="0" x2="150" y2="340" /><line x1="350" y1="0" x2="350" y2="340" />
    <line x1="550" y1="0" x2="550" y2="340" /><line x1="750" y1="0" x2="750" y2="340" />
    <line x1="950" y1="0" x2="950" y2="340" /><line x1="1150" y1="0" x2="1150" y2="340" />
  </g>

  <!-- Dynamic Background ECG Line -->
  <path class="ecg-wave" d="M 0,270 L 250,270 L 270,240 L 285,300 L 305,210 L 325,290 L 340,270 L 600,270 L 620,240 L 635,300 L 655,200 L 675,295 L 690,270 L 950,270 L 970,240 L 985,300 L 1005,210 L 1025,290 L 1040,270 L 1200,270" />

  <!-- Dynamic Animated Flow Nodes (Background Decorative) -->
  <g class="floating" opacity="0.4">
    <!-- Process Flow Pills in background -->
    <rect x="70" y="35" width="110" height="32" class="flow-node" />
    <text x="125" y="55" class="node-text">🚨 Triage</text>

    <line x1="180" y1="51" x2="230" y2="51" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4" />

    <rect x="230" y="35" width="125" height="32" class="flow-node" />
    <text x="292" y="55" class="node-text">⚡ Capacity AI</text>

    <line x1="355" y1="51" x2="405" y2="51" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4" />

    <rect x="405" y="35" width="130" height="32" class="flow-node" />
    <text x="470" y="55" class="node-text">🏥 Bed Tracking</text>

    <line x1="535" y1="51" x2="585" y2="51" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4" />

    <rect x="585" y="35" width="140" height="32" class="flow-node" />
    <text x="655" y="55" class="node-text">📊 Command Center</text>

    <line x1="725" y1="51" x2="775" y2="51" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4" />

    <rect x="775" y="35" width="130" height="32" class="flow-node" />
    <text x="840" y="55" class="node-text">⏱️ Throughput</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Icon / Badge above Header -->
    <rect x="480" y="105" width="240" height="30" class="pill-badge" />
    <text x="600" y="125" class="pill-text" text-anchor="middle">🏥 HEALTHCARE OPERATIONS</text>

    <!-- Main Title -->
    <text x="600" y="180" class="banner-title">Awesome Emergency Department Flow</text>

    <!-- Subtitle -->
    <text x="600" y="218" class="banner-subtitle">Curated SaaS Platforms, Open-Source Engines &amp; AI Frameworks for Patient Throughput</text>

    <!-- Secondary Highlights -->
    <g transform="translate(300, 290)">
      <circle cx="15" cy="-5" r="4" fill="#10b981" />
      <text x="25" y="0" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Bed Management</text>
      
      <circle cx="185" cy="-5" r="4" fill="#38bdf8" />
      <text x="195" y="0" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Command Centers</text>

      <circle cx="375" cy="-5" r="4" fill="#818cf8" />
      <text x="385" y="0" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Predictive Analytics</text>

      <circle cx="565" cy="-5" r="4" fill="#c084fc" />
      <text x="575" y="0" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">FHIR Interoperability</text>
    </g>
  </g>
</svg>
